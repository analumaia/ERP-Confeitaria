<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — ERP Bakeria</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
  <div class="container">
    <div class="cabecalho-interno">
      <div class="logo-caixa"><img src="logo.png" alt="Bakeria Confeitaria Artesanal"></div>
      <img class="mascote-cabecalho" src="mascote-cabecalho.png" alt="">
      <button class="btn-sair" id="btnSair">Sair</button>
    </div>
  </div>
</header>

<div class="container">

  <nav class="abas-modulos" id="abasModulos"></nav>

  <!-- ESTOQUE -->
  <section class="conteudo-modulo" data-modulo="estoque">
    <div class="barra-modulo">
      <h2>Estoque</h2>
      <button class="btn-novo" id="btnFazerBalanco">📋 Fazer balanço</button>
    </div>

    <div class="barra-modulo" id="barraBalanco" style="display:none;">
      <p style="margin:0; font-size:0.85rem; color:var(--marrom-cafe);">Corrija as quantidades contadas e salve — o sistema lança o ajuste sozinho.</p>
      <div style="display:flex; gap:10px;">
        <button class="btn-secundario" id="btnCancelarBalanco" style="flex:none; padding:10px 18px;">Cancelar</button>
        <button class="btn-primario" id="btnSalvarBalanco" style="margin-top:0; width:auto; padding:10px 18px;">Salvar balanço</button>
      </div>
    </div>

    <h3 class="fonte-titulo" style="font-size:1.1rem; margin:18px 0 10px;">Insumos</h3>
    <div class="lista-cards" data-lista-estoque="insumo"></div>

    <h3 class="fonte-titulo" style="font-size:1.1rem; margin:26px 0 10px;">Produtos</h3>
    <div class="lista-cards" data-lista-estoque="produto"></div>

    <h3 class="fonte-titulo" style="font-size:1.1rem; margin:26px 0 10px;">Últimas movimentações</h3>
    <div class="lista-cards" id="listaMovimentacoes"></div>
  </section>

  <!-- COMPRAS -->
  <section class="conteudo-modulo" data-modulo="compras">
    <div class="barra-modulo">
      <h2>Compras</h2>
      <button class="btn-novo" id="btnNovaCompra">+ Nova compra</button>
    </div>
    <div class="lista-cards" id="listaCompras"></div>
  </section>

  <!-- PRODUÇÃO -->
  <section class="conteudo-modulo" data-modulo="producao">
    <div class="barra-modulo">
      <h2>Produção</h2>
      <button class="btn-novo" id="btnNovaProducao">+ Nova produção</button>
    </div>

    <h3 class="fonte-titulo" style="font-size:1.1rem; margin:10px 0;">Fichas técnicas</h3>
    <div class="lista-cards" id="listaFichasTecnicas"></div>

    <h3 class="fonte-titulo" style="font-size:1.1rem; margin:26px 0 10px;">Histórico de produções</h3>
    <div class="lista-cards" id="listaProducoes"></div>
  </section>

  <!-- VENDAS -->
  <section class="conteudo-modulo" data-modulo="vendas">
    <div class="barra-modulo">
      <h2>Vendas</h2>
      <button class="btn-novo" id="btnNovaVenda">+ Nova venda</button>
    </div>
    <div class="lista-cards" id="listaVendas"></div>
  </section>

  <!-- FINANCEIRO -->
  <section class="conteudo-modulo" data-modulo="financeiro">
    <div class="barra-modulo">
      <h2>Financeiro</h2>
      <input type="month" id="filtroMesFinanceiro" class="campo-busca" style="max-width:160px;">
      <button class="btn-novo" id="btnNovoLancamento">+ Lançamento manual</button>
    </div>

    <div class="lista-cards" id="resumoFinanceiro" style="margin-bottom:8px;"></div>

    <h3 class="fonte-titulo" style="font-size:1.1rem; margin:26px 0 10px;">Lançamentos do mês</h3>
    <div class="lista-cards" id="listaLancamentos"></div>
  </section>

  <!-- INSUMOS -->
  <section class="conteudo-modulo" data-modulo="insumos">
    <div class="barra-modulo">
      <h2>Insumos</h2>
      <input type="search" class="campo-busca" placeholder="Buscar insumo..." data-busca="insumos">
      <button class="btn-novo" data-novo="insumos">+ Novo insumo</button>
    </div>
    <div class="lista-cards" data-lista="insumos"></div>
  </section>

  <!-- PRODUTOS -->
  <section class="conteudo-modulo" data-modulo="produtos">
    <div class="barra-modulo">
      <h2>Produtos</h2>
      <input type="search" class="campo-busca" placeholder="Buscar produto..." data-busca="produtos">
      <button class="btn-novo" data-novo="produtos">+ Novo produto</button>
    </div>
    <div class="lista-cards" data-lista="produtos"></div>
  </section>

  <!-- FORNECEDORES -->
  <section class="conteudo-modulo" data-modulo="fornecedores">
    <div class="barra-modulo">
      <h2>Fornecedores</h2>
      <input type="search" class="campo-busca" placeholder="Buscar fornecedor..." data-busca="fornecedores">
      <button class="btn-novo" data-novo="fornecedores">+ Novo fornecedor</button>
    </div>
    <div class="lista-cards" data-lista="fornecedores"></div>
  </section>

  <!-- CLIENTES -->
  <section class="conteudo-modulo" data-modulo="clientes">
    <div class="barra-modulo">
      <h2>Clientes</h2>
      <input type="search" class="campo-busca" placeholder="Buscar cliente..." data-busca="clientes">
      <button class="btn-novo" data-novo="clientes">+ Novo cliente</button>
    </div>
    <div class="lista-cards" data-lista="clientes"></div>
  </section>

</div>

<!-- MODAL genérico de criar/editar, preenchido dinamicamente pelo JS -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitulo">Novo registro</h3>
    <form id="modalForm">
      <div id="modalCampos"></div>
      <div class="acoes-modal">
        <button type="button" class="btn-secundario" id="btnCancelarModal">Cancelar</button>
        <button type="submit" class="btn-primario" id="btnSalvarModal">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="painel.js"></script>
</body>
</html>
